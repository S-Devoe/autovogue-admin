name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build for staging (with CSP meta tag)
        run: pnpm build:staging

      - name: Build for production (with CSP meta tag)
        run: pnpm build:production

      - name: First-route bundle under 400 KB gzipped
        run: pnpm size

      - name: Known vulnerabilities (production dependencies)
        run: pnpm audit --prod --audit-level high

# End-to-end tests (Playwright) need a running API and a staff account with
# 2FA, so they run locally: see README, Tests.
